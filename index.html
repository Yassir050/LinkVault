<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkVault</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">

            <div class="logo">
                <div class="logo-icon">🔗</div>

                <div>
                    <h1>LinkVault</h1>
                    <p>Save. Organize. Access.</p>
                </div>
            </div>

            <button
                class="theme-button"
                id="themeButton"
                type="button"
                aria-label="Toggle theme"
            >
                🌙
            </button>

        </header>


        <!-- DASHBOARD -->
        <section class="dashboard">

            <div class="stat-card">
                <span class="stat-icon">🔗</span>

                <div>
                    <span class="stat-label">Total Links</span>
                    <strong id="totalLinks">0</strong>
                </div>
            </div>


            <div class="stat-card">
                <span class="stat-icon">⭐</span>

                <div>
                    <span class="stat-label">Favorites</span>
                    <strong id="favoriteLinks">0</strong>
                </div>
            </div>


            <div class="stat-card">
                <span class="stat-icon">📁</span>

                <div>
                    <span class="stat-label">Categories</span>
                    <strong id="totalCategories">0</strong>
                </div>
            </div>

        </section>


        <!-- ADD LINK -->
        <section class="add-section">

            <button
                class="add-button"
                id="openModalButton"
                type="button"
            >
                <span>＋</span>
                Add Link
            </button>

        </section>


        <!-- SEARCH -->
        <section class="controls">

            <div class="search-box">

                <span>🔎</span>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search your links..."
                    autocomplete="off"
                >

            </div>


            <div class="filter-row">

                <button
                    class="filter-button active"
                    data-category="all"
                    type="button"
                >
                    All
                </button>

                <button
                    class="filter-button"
                    data-category="GitHub"
                    type="button"
                >
                    GitHub
                </button>

                <button
                    class="filter-button"
                    data-category="Learning"
                    type="button"
                >
                    Learning
                </button>

                <button
                    class="filter-button"
                    data-category="Tools"
                    type="button"
                >
                    Tools
                </button>

                <button
                    class="filter-button"
                    data-category="Resources"
                    type="button"
                >
                    Resources
                </button>

            </div>

        </section>


        <!-- LINKS -->
        <main>

            <div
                class="links-grid"
                id="linksGrid"
            ></div>


            <div
                class="empty-state"
                id="emptyState"
            >
                <div class="empty-icon">🔗</div>

                <h2>No links found</h2>

                <p>
                    Add your first useful link to start building your vault.
                </p>
            </div>

        </main>

    </div>


    <!-- MODAL -->
    <div
        class="modal hidden"
        id="linkModal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <div>
                    <h2 id="modalTitle">Add Link</h2>
                    <p>Save a useful resource.</p>
                </div>

                <button
                    class="close-button"
                    id="closeModalButton"
                    type="button"
                >
                    ×
                </button>

            </div>


            <form id="linkForm">

                <input
                    type="hidden"
                    id="linkId"
                >


                <label for="linkTitle">
                    Title
                </label>

                <input
                    id="linkTitle"
                    type="text"
                    placeholder="GitHub"
                    required
                    maxlength="80"
                >


                <label for="linkUrl">
                    URL
                </label>

                <input
                    id="linkUrl"
                    type="url"
                    placeholder="https://github.com"
                    required
                >


                <label for="linkCategory">
                    Category
                </label>

                <select
                    id="linkCategory"
                    required
                >
                    <option value="GitHub">GitHub</option>
                    <option value="Learning">Learning</option>
                    <option value="Tools">Tools</option>
                    <option value="Resources">Resources</option>
                </select>


                <label for="linkDescription">
                    Description
                </label>

                <textarea
                    id="linkDescription"
                    placeholder="What is this link useful for?"
                    maxlength="200"
                ></textarea>


                <label class="favorite-input">

                    <input
                        id="linkFavorite"
                        type="checkbox"
                    >

                    <span>⭐ Add to favorites</span>

                </label>


                <button
                    class="save-button"
                    type="submit"
                >
                    Save Link
                </button>

            </form>

        </div>

    </div>


    <!-- TOAST -->
    <div
        class="toast"
        id="toast"
    ></div>


    <script src="script.js"></script>

</body>
</html>
